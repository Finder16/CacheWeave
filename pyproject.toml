[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheweave"
version = "0.1.0"
description = "Recover Word documents from the Microsoft Office Document Cache"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography==49.0.0",
  "lz4==4.4.5",
  "numpy==2.2.2",
]

[project.scripts]
cacheweave = "cacheweave.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
